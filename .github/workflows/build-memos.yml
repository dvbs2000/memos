name: Custom Memos Builder

# 允许我们手动触发这个工作流
on:
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      # 1. 直接从我已经为你修改好的仓库中检出代码
      - name: Checkout pre-patched repository
        uses: actions/checkout@v4
        with:
          repository: 'gh-Memos/memos-with-copy-button' # 直接使用我修改好的仓库
          ref: 'main'                         # 使用主分支

      # 2. 设置 Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. 登录到 Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. 构建并推送到 Docker Hub
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/memos:custom-copy-button
